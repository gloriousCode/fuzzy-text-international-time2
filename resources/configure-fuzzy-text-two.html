<head>

</head>
<body>

	<div class="container">

				<div class="form-group">

						<option value="black">black</option>

						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>
						<option value="cyan">cyan</option>
						<option value="blue">blue</option>

				<div class="form-group">
					<label for="row-three-colour">hour row</label>
					<select class="form-control" id="row-three-colour" name="row_three_colour">
						<option value="match" selected>match foreground</option>
						<option value="white">white</option>
						<option value="black">black</option>
						<option value="red">red</option>
						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>

						<option value="match" selected>match foreground</option>

						<option value="red">red</option>

						<option value="yellow">yellow</option>

						<option value="mint">mint</option>

				<div class="form-group">

					<select class="form-control" id="date-part-two-colour" name="date_part_two_colour">

						<option value="black">black</option>

						<option value="green">green</option>

				<div class="form-group">
					<label for="date-part-three-colour">date third section</label>

						<option value="match" selected>match foreground</option>

						<option value="red">red</option>
						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>
						<option value="cyan">cyan</option>
						<option value="blue">blue</option>
						<option value="purple">purple</option>
						<option value="magenta">magenta</option>
					</select>
				</div>
			</fieldset>

			<fieldset>
				<legend>Text align:</legend>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="left" />

				</div>
				<div class="radio-inline">
					<label>

			<fieldset>
				<legend>Corner date:</legend>
				<div class="form-group">
					<label for="date-position">placement</label>
					<select class="form-control" id="date-position" name="date_position">
						<option value="off" selected>off</option>
						<option value="top">top</option>

					</select>
				</div>
				<div class="form-group">
					<label for="date-format">format</label>
					<select class="form-control" id="date-format" name="date_format">
						<option value="dd_mm_yy" selected>dd-mm-yy</option>
						<option value="mm_dd_yyyy">mm-dd-yyyy</option>
						<option value="mon_d_aug">Mon 3 Aug</option>
						<option value="dd_slash_mm">dd/mm</option>
						<option value="mm_slash_dd">mm/dd</option>
					</select>
				</div>
			</fieldset>

			<fieldset>
				<legend>Language:</legend>
				<div class="radio">
					<label>
						<input type="radio" name="lang" value="ca" />
						Català
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="de" />

					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="en_GB" checked />
						English (Great Britain)
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="en_US" />
						English (United States)
					</label>

				<div class="radio">

						<input type="radio" name="lang" value="es" />
						Español

				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="fr" />

				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="no" />
						Norsk
					</label>
				</div>

				<div class="radio">

						<input type="radio" name="lang" value="sv" />
						Svenska

				</div>

			<fieldset>
				<a href="pebblejs://close" class="btn btn-lg btn-default" role="button">Cancel</a>
				<button type="button" class="btn btn-lg btn-primary" id="b-submit">Save</button>

		</form>

	</div><!-- container -->

<!-- End Document
================================================== -->

	<script>
		var presets = {
			classic: {
				text_align: 'center',
				font: 'classic',
				foreground_colour: 'white',
				background_colour: 'black',
				row_one_colour: 'match',
				row_two_colour: 'match',
				row_three_colour: 'match',
				date_part_one_colour: 'match',
				date_part_two_colour: 'match',
				date_part_three_colour: 'match',
				date_position: 'off',
				date_format: 'dd_mm_yy'
			},
			paper: {
				text_align: 'center',
				font: 'sharp',
				foreground_colour: 'black',
				background_colour: 'white',
				row_one_colour: 'match',
				row_two_colour: 'match',
				row_three_colour: 'match',
				date_part_one_colour: 'match',
				date_part_two_colour: 'match',
				date_part_three_colour: 'match',
				date_position: 'top',
				date_format: 'dd_slash_mm'
			},
			quiet: {
				text_align: 'center',
				font: 'compact',
				foreground_colour: 'white',
				background_colour: 'black',
				row_one_colour: 'white',
				row_two_colour: 'white',
				row_three_colour: 'white',
				date_part_one_colour: 'white',
				date_part_two_colour: 'white',
				date_part_three_colour: 'white',
				date_position: 'off',
				date_format: 'dd_mm_yy'
			},
			ocean: {
				text_align: 'left',
				font: 'compact',
				foreground_colour: 'cyan',
				background_colour: 'blue',
				row_one_colour: 'mint',
				row_two_colour: 'cyan',
				row_three_colour: 'white',
				date_part_one_colour: 'white',
				date_part_two_colour: 'mint',
				date_part_three_colour: 'cyan',
				date_position: 'bottom',
				date_format: 'mon_d_aug'
			},
			berry: {
				text_align: 'right',
				font: 'tall',
				foreground_colour: 'yellow',
				background_colour: 'purple',
				row_one_colour: 'magenta',
				row_two_colour: 'yellow',
				row_three_colour: 'white',
				date_part_one_colour: 'yellow',
				date_part_two_colour: 'magenta',
				date_part_three_colour: 'white',
				date_position: 'top',
				date_format: 'mm_dd_yyyy'
			},
			traffic: {
				text_align: 'center',
				font: 'classic',
				foreground_colour: 'white',
				background_colour: 'black',
				row_one_colour: 'red',
				row_two_colour: 'orange',
				row_three_colour: 'green',
				date_part_one_colour: 'red',
				date_part_two_colour: 'yellow',
				date_part_three_colour: 'green',
				date_position: 'top',
				date_format: 'dd_mm_yy'
			},
			candy: {
				text_align: 'center',
				font: 'sharp',
				foreground_colour: 'purple',
				background_colour: 'white',
				row_one_colour: 'blue',
				row_two_colour: 'magenta',
				row_three_colour: 'purple',
				date_part_one_colour: 'blue',
				date_part_two_colour: 'magenta',
				date_part_three_colour: 'purple',
				date_position: 'bottom',
				date_format: 'mm_slash_dd'
			},
			terminal: {
				text_align: 'left',
				font: 'compact',
				foreground_colour: 'green',
				background_colour: 'black',
				row_one_colour: 'green',
				row_two_colour: 'mint',
				row_three_colour: 'cyan',
				date_part_one_colour: 'green',
				date_part_two_colour: 'mint',
				date_part_three_colour: 'cyan',
				date_position: 'bottom',
				date_format: 'dd_slash_mm'
			},
			festival: {
				text_align: 'center',
				font: 'tall',
				foreground_colour: 'yellow',
				background_colour: 'blue',
				row_one_colour: 'orange',
				row_two_colour: 'magenta',
				row_three_colour: 'yellow',
				date_part_one_colour: 'cyan',
				date_part_two_colour: 'magenta',
				date_part_three_colour: 'yellow',
				date_position: 'top',
				date_format: 'mon_d_aug'
			},
			arcade: {
				text_align: 'right',
				font: 'classic',
				foreground_colour: 'mint',
				background_colour: 'black',
				row_one_colour: 'cyan',
				row_two_colour: 'mint',
				row_three_colour: 'magenta',
				date_part_one_colour: 'mint',
				date_part_two_colour: 'cyan',
				date_part_three_colour: 'magenta',
				date_position: 'bottom',
				date_format: 'mm_dd_yyyy'
			}
		};

		function each(selector, fn) {
			Array.prototype.forEach.call(document.querySelectorAll(selector), fn);
		}

		function checkedValue(name) {
			var input = document.querySelector('[name="' + name + '"]:checked');
			return input ? input.value : undefined;
		}

		function setChecked(name, value) {
			each('[name="' + name + '"]', function(input) {
				input.checked = input.value === value;
			});
		}

		function selectValue(name, fallback) {
			var select = document.querySelector('[name="' + name + '"]');
			return select && select.value ? select.value : fallback;
		}

		function setSelectValue(name, value) {
			var select = document.querySelector('[name="' + name + '"]');
			if (select) {
				select.value = value;
			}
		}

		function saveOptions() {
			var options = {
				schema:		4,
				text_align:	checkedValue('align') || 'center',
				lang:		checkedValue('lang') || 'en_GB',
				font:		checkedValue('font') || 'classic',
				foreground_colour: document.querySelector('[name="foreground_colour"]').value || 'white',
				background_colour: document.querySelector('[name="background_colour"]').value || 'black',
				row_one_colour: document.querySelector('[name="row_one_colour"]').value || 'match',
				row_two_colour: document.querySelector('[name="row_two_colour"]').value || 'match',
				row_three_colour: document.querySelector('[name="row_three_colour"]').value || 'match',
				date_part_one_colour: document.querySelector('[name="date_part_one_colour"]').value || 'match',
				date_part_two_colour: document.querySelector('[name="date_part_two_colour"]').value || 'match',
				date_part_three_colour: document.querySelector('[name="date_part_three_colour"]').value || 'match',
				date_position: selectValue('date_position', 'off'),
				date_format: selectValue('date_format', 'dd_mm_yy'),
				preset: selectValue('preset', 'classic')
			}
			return options;
		}

		function applyOptions() {
			var optionsParam = getParam('options');
			var opts = {};
			if (optionsParam) {
				try {
					opts = JSON.parse(optionsParam);
				}
				catch (err) {
					opts = {};
				}
			}
			if (opts && opts.text_align) {
				setChecked('align', opts.text_align);
			}
			if (opts && opts.lang) {
				setChecked('lang', opts.lang);
			}
			if (opts && opts.font) {
				setChecked('font', opts.font);
			}
			if (opts && opts.foreground_colour) {
				document.querySelector('[name="foreground_colour"]').value = opts.foreground_colour;
			}
			if (opts && opts.background_colour) {
				document.querySelector('[name="background_colour"]').value = opts.background_colour;
			}
			document.querySelector('[name="row_one_colour"]').value = opts.row_one_colour || opts.minute_colour || 'match';
			document.querySelector('[name="row_two_colour"]').value = opts.row_two_colour || opts.minute_colour || 'match';
			document.querySelector('[name="row_three_colour"]').value = opts.row_three_colour || opts.hour_colour || 'match';
			document.querySelector('[name="date_part_one_colour"]').value = opts.date_part_one_colour || opts.date_colour || 'match';
			document.querySelector('[name="date_part_two_colour"]').value = opts.date_part_two_colour || opts.date_colour || 'match';
			document.querySelector('[name="date_part_three_colour"]').value = opts.date_part_three_colour || opts.date_colour || 'match';
			if (opts && opts.date_position) {
				setSelectValue('date_position', opts.date_position);
			}
			if (opts && opts.date_format) {
				setSelectValue('date_format', opts.date_format);
			}
			if (opts && opts.preset) {
				setSelectValue('preset', opts.preset);
			}
		}

		function getParam(key) {
			var params = window.location.hash + '&' + window.location.search;
			var val;
			params.replace(/(?:^|[#?&])([a-z_]+)=([^&]+)/ig, function(_, k, v) {
				if (key === k) {
					val = decodeURIComponent(v);
				}
			});
			return val;
		}

		document.getElementById('b-submit').addEventListener('click', function() {
			var returnTo = getParam('return_to');
			var location = returnTo
				? returnTo + encodeURIComponent(JSON.stringify(saveOptions()))
				: "pebblejs://close#" + encodeURIComponent(JSON.stringify(saveOptions()));
			document.location = location;
		});

		document.querySelector('[href="pebblejs://close"]').addEventListener('click', function(event) {
			var returnTo = getParam('return_to');
			if (!returnTo) {
				return;
			}

			event.preventDefault();
			document.location = returnTo;
		});

		document.querySelector('[name="preset"]').addEventListener('change', function() {
			var preset = presets[this.value];
			if (!preset) {
				return;
			}

			setChecked('align', preset.text_align);
			setChecked('font', preset.font);
			document.querySelector('[name="foreground_colour"]').value = preset.foreground_colour;
			document.querySelector('[name="background_colour"]').value = preset.background_colour;
			document.querySelector('[name="row_one_colour"]').value = preset.row_one_colour;
			document.querySelector('[name="row_two_colour"]').value = preset.row_two_colour;
			document.querySelector('[name="row_three_colour"]').value = preset.row_three_colour;
			document.querySelector('[name="date_part_one_colour"]').value = preset.date_part_one_colour;
			document.querySelector('[name="date_part_two_colour"]').value = preset.date_part_two_colour;
			document.querySelector('[name="date_part_three_colour"]').value = preset.date_part_three_colour;
			setSelectValue('date_position', preset.date_position);
			setSelectValue('date_format', preset.date_format);
		});

		applyOptions();
