<!DOCTYPE html>
<!--[if lt IE 7 ]><html class="ie ie6" lang="en"> <![endif]-->
<!--[if IE 7 ]><html class="ie ie7" lang="en"> <![endif]-->
<!--[if IE 8 ]><html class="ie ie8" lang="en"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!--><html lang="en"> <!--<![endif]-->
<head>

	<!-- Basic Page Needs
  ================================================== -->
	<meta charset="utf-8">
	<title>Configure Fuzzy Text Two</title>
	<meta name="description" content="configuration page for Fuzzy Text Two, a Pebble watchface">
	<meta name="author" content="gloriousCode">

	<!-- Mobile Specific Metas
  ================================================== -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			margin: 0;
			padding: 16px;
			color: #111;
			background: #f6f4ef;
		}
		.container {
			max-width: 760px;
			margin: 0 auto;
		}
		.hidden {
			display: none;
		}
		fieldset {
			margin: 14px 0;
			padding: 12px 14px;
			border: 1px solid #b8b5ad;
			background: #fff;
		}
		legend {
			padding: 0 6px;
			font-weight: 700;
		}
		label {
			display: block;
			margin: 8px 0;
		}
		select {
			margin: 4px 0 10px;
			padding: 6px;
			min-width: 160px;
		}
		.btn,
		button {
			display: inline-block;
			margin-right: 8px;
			padding: 8px 14px;
			border-radius: 4px;
			border: 1px solid #777;
			background: #eee;
			color: #111;
			text-decoration: none;
			font-size: 16px;
		}
		.btn-primary {
			background: #2f6fda;
			border-color: #2558ad;
			color: #fff;
		}
	</style>

</head>
<body>

	<!-- Primary Page Layout
	================================================== -->

	<div class="container">
		<header>
			<h1>Configure Fuzzy Text Two</h1>
		</header>

		<form id="config" role="form" class="input-lg">

			<fieldset>
				<legend>Presets:</legend>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="classic" checked />
						classic
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="paper" />
						paper
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="ocean" />
						ocean
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="berry" />
						berry
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Fonts:</legend>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="classic" checked />
						classic Bitham
					</label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="sharp" />
						sharp Gothic
					</label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="compact" />
						compact Gothic
					</label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="tall" />
						tall Bitham
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Colours:</legend>
				<div class="form-group">
					<label for="foreground-colour">foreground</label>
					<select class="form-control" id="foreground-colour" name="foreground_colour">
						<option value="white" selected>white</option>
						<option value="black">black</option>
						<option value="red">red</option>
						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>
						<option value="cyan">cyan</option>
						<option value="blue">blue</option>
						<option value="purple">purple</option>
						<option value="magenta">magenta</option>
					</select>
				</div>
				<div class="form-group">
					<label for="background-colour">background</label>
					<select class="form-control" id="background-colour" name="background_colour">
						<option value="black" selected>black</option>
						<option value="white">white</option>
						<option value="red">red</option>
						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>
						<option value="cyan">cyan</option>
						<option value="blue">blue</option>
						<option value="purple">purple</option>
						<option value="magenta">magenta</option>
					</select>
				</div>
			</fieldset>

			<fieldset>
				<legend>Text align:</legend>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="left" />
						left
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="center" checked />
						center
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="right" />
						right
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Language:</legend>
				<div class="radio">
					<label>
						<input type="radio" name="lang" value="ca" />
						Català
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="de" />
						Deutsch
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="en_GB" checked />
						English (Great Britain)
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="en_US" />
						English (United States)
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="es" />
						Español
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="fr" />
						Français
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="no" />
						Norsk
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="sv" />
						Svenska
					</label>
				</div>
			</fieldset>

			<fieldset>
				<a href="pebblejs://close" class="btn btn-lg btn-default" role="button">Cancel</a>
				<button type="button" class="btn btn-lg btn-primary" id="b-submit">Save</button>
			</fieldset>
		</form>

	</div><!-- container -->

<!-- End Document
================================================== -->

	<script>
		var presets = {
			classic: {
				font: 'classic',
				foreground_colour: 'white',
				background_colour: 'black'
			},
			paper: {
				font: 'sharp',
				foreground_colour: 'black',
				background_colour: 'white'
			},
			ocean: {
				font: 'compact',
				foreground_colour: 'cyan',
				background_colour: 'blue'
			},
			berry: {
				font: 'tall',
				foreground_colour: 'yellow',
				background_colour: 'purple'
			}
		};

		function each(selector, fn) {
			Array.prototype.forEach.call(document.querySelectorAll(selector), fn);
		}

		function checkedValue(name) {
			var input = document.querySelector('[name="' + name + '"]:checked');
			return input ? input.value : undefined;
		}

		function setChecked(name, value) {
			each('[name="' + name + '"]', function(input) {
				input.checked = input.value === value;
			});
		}

		function saveOptions() {
			var options = {
				schema:		2,
				text_align:	checkedValue('align') || 'center',
				lang:		checkedValue('lang') || 'en_GB',
				font:		checkedValue('font') || 'classic',
				foreground_colour: document.querySelector('[name="foreground_colour"]').value || 'white',
				background_colour: document.querySelector('[name="background_colour"]').value || 'black',
				preset: checkedValue('preset') || 'classic'
			}
			return options;
		}

		function applyOptions() {
			var optionsParam = getParam('options');
			var opts = {};
			if (optionsParam) {
				try {
					opts = JSON.parse(optionsParam);
				}
				catch (err) {
					opts = {};
				}
			}
			if (opts && opts.text_align) {
				setChecked('align', opts.text_align);
			}
			if (opts && opts.lang) {
				setChecked('lang', opts.lang);
			}
			if (opts && opts.font) {
				setChecked('font', opts.font);
			}
			if (opts && opts.foreground_colour) {
				document.querySelector('[name="foreground_colour"]').value = opts.foreground_colour;
			}
			if (opts && opts.background_colour) {
				document.querySelector('[name="background_colour"]').value = opts.background_colour;
			}
			if (opts && opts.preset) {
				setChecked('preset', opts.preset);
			}
		}

		function getParam(key) {
			var params = window.location.hash + '&' + window.location.search;
			var val;
			params.replace(/(?:^|[#?&])([a-z_]+)=([^&]+)/ig, function(_, k, v) {
				if (key === k) {
					val = decodeURIComponent(v);
				}
			});
			return val;
		}

		document.getElementById('b-submit').addEventListener('click', function() {
			var returnTo = getParam('return_to');
			var location = returnTo
				? returnTo + encodeURIComponent(JSON.stringify(saveOptions()))
				: "pebblejs://close#" + encodeURIComponent(JSON.stringify(saveOptions()));
			document.location = location;
		});

		document.querySelector('[href="pebblejs://close"]').addEventListener('click', function(event) {
			var returnTo = getParam('return_to');
			if (!returnTo) {
				return;
			}

			event.preventDefault();
			document.location = returnTo;
		});

		each('[name="preset"]', function(input) {
			input.addEventListener('change', function() {
				var preset = presets[this.value];
				if (!preset) {
					return;
				}

				setChecked('font', preset.font);
				document.querySelector('[name="foreground_colour"]').value = preset.foreground_colour;
				document.querySelector('[name="background_colour"]').value = preset.background_colour;
			});
		});

		applyOptions();
   </script>

</body>
</html>
