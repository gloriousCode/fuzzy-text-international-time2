<!DOCTYPE html>
<!--[if lt IE 7 ]><html class="ie ie6" lang="en"> <![endif]-->
<!--[if IE 7 ]><html class="ie ie7" lang="en"> <![endif]-->
<!--[if IE 8 ]><html class="ie ie8" lang="en"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!--><html lang="en"> <!--<![endif]-->
<head>

	<!-- Basic Page Needs
  ================================================== -->
	<meta charset="utf-8">
	<title>Configure Fuzzy Text</title>
	<meta name="description" content="configuration page for Fuzzy Text International, a Pebble watchface">
	<meta name="author" content="Jesse Hallett <jesse@sitr.us>">

	<!-- Mobile Specific Metas
  ================================================== -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

	<!-- CSS
  ================================================== -->
	<link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css">

	<!--[if lt IE 9]>
		<script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>
	<![endif]-->

</head>
<body>

	<!-- Primary Page Layout
	================================================== -->

	<div class="container">
		<header>
			<h1>Configure Fuzzy Text Int'l</h1>
		</header>
		
		<div id="update-available" class="hidden bg-danger" style="padding:0.75em">
			<p>There is a new version of Fuzzy Text International
			available - some settings will not work until you update to
			the new version. <a href="CHANGES.html">See
			details</a></p>
		</div>

		<div id="up-to-date" class="hidden bg-info" style="padding:0.75em">
			<p>Your version of Fuzzy Text International is up-to-date.
			<a href="CHANGES.html">See changes</a></p>
		</div>

		<form id="config" role="form" class="input-lg">

			<fieldset>
				<legend>Presets:</legend>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="classic" checked />
						classic
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="paper" />
						paper
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="ocean" />
						ocean
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="preset" value="berry" />
						berry
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Fonts:</legend>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="classic" checked />
						classic Bitham
					</label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="sharp" />
						sharp Gothic
					</label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="compact" />
						compact Gothic
					</label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="font" value="tall" />
						tall Bitham
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Colours:</legend>
				<div class="form-group">
					<label for="foreground-colour">foreground</label>
					<select class="form-control" id="foreground-colour" name="foreground_colour">
						<option value="white" selected>white</option>
						<option value="black">black</option>
						<option value="red">red</option>
						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>
						<option value="cyan">cyan</option>
						<option value="blue">blue</option>
						<option value="purple">purple</option>
						<option value="magenta">magenta</option>
					</select>
				</div>
				<div class="form-group">
					<label for="background-colour">background</label>
					<select class="form-control" id="background-colour" name="background_colour">
						<option value="black" selected>black</option>
						<option value="white">white</option>
						<option value="red">red</option>
						<option value="orange">orange</option>
						<option value="yellow">yellow</option>
						<option value="green">green</option>
						<option value="mint">mint</option>
						<option value="cyan">cyan</option>
						<option value="blue">blue</option>
						<option value="purple">purple</option>
						<option value="magenta">magenta</option>
					</select>
				</div>
			</fieldset>

			<fieldset>
				<legend>Text align:</legend>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="left" />
						left
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="center" checked />
						center
					</label>
				</div>
				<div class="radio-inline">
					<label>
						<input type="radio" name="align" value="right" />
						right
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Language:</legend>
				<div class="radio">
					<label>
						<input type="radio" name="lang" value="ca" />
						Català
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="de" />
						Deutsch
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="en_GB" />
						English (Great Britain)
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="en_US" checked />
						English (United States)
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="es" />
						Español
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="fr" />
						Français
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="no" />
						Norsk
					</label>
				</div>

				<div class="radio">
					<label>
						<input type="radio" name="lang" value="sv" />
						Svenska
					</label>
				</div>
			</fieldset>

			<fieldset>
				<a href="pebblejs://close" class="btn btn-lg btn-default" role="button">Cancel</a>
				<button type="button" class="btn btn-lg btn-primary" id="b-submit">Save</button>
			</fieldset>
		</form>

	</div><!-- container -->

<!-- End Document
================================================== -->

	<script src="http://code.jquery.com/jquery-1.11.0.min.js"></script>
	<script>
		var LATEST = "1.4.0";

		var presets = {
			classic: {
				font: 'classic',
				foreground_colour: 'white',
				background_colour: 'black'
			},
			paper: {
				font: 'sharp',
				foreground_colour: 'black',
				background_colour: 'white'
			},
			ocean: {
				font: 'compact',
				foreground_colour: 'cyan',
				background_colour: 'blue'
			},
			berry: {
				font: 'tall',
				foreground_colour: 'yellow',
				background_colour: 'purple'
			}
		};

		function saveOptions() {
			var params = {};
			$('#config').serializeArray().forEach(function(pair) {
				params[pair.name] = pair.value;
			});

			var options = {
				text_align:	params.align || 'center',
				lang:		params.lang,
				font:		params.font || 'classic',
				foreground_colour: params.foreground_colour || 'white',
				background_colour: params.background_colour || 'black',
				preset: params.preset || 'classic'
			}
			return options;
		}

		function applyOptions() {
			var $form	= $('#config');
			var opts	= JSON.parse(getParam('options'));
			if (opts && opts.text_align) {
				$form.find('[name="align"]').filter(function(i, btn) {
					return btn.value === opts.text_align;
				}).prop('checked', true);
			}
			if (opts && opts.lang) {
				$form.find('[name="lang"]').filter(function(i, btn) {
					return btn.value === opts.lang;
				}).prop('checked', true);
			}
			if (opts && opts.font) {
				$form.find('[name="font"]').filter(function(i, btn) {
					return btn.value === opts.font;
				}).prop('checked', true);
			}
			if (opts && opts.foreground_colour) {
				$form.find('[name="foreground_colour"]').val(opts.foreground_colour);
			}
			if (opts && opts.background_colour) {
				$form.find('[name="background_colour"]').val(opts.background_colour);
			}
			if (opts && opts.preset) {
				$form.find('[name="preset"]').filter(function(i, btn) {
					return btn.value === opts.preset;
				}).prop('checked', true);
			}
		}

		function getParam(key) {
			var params = window.location.hash + '&' + window.location.search;
			var val;
			params.replace(/(?:^|[#?&])([a-z_]+)=([^&]+)/ig, function(_, k, v) {
				if (key === k) {
					val = decodeURIComponent(v);
				}
			});
			return val;
		}

		function parseVersion(verStr) {
			var parts = verStr.split('.');
			return parts.reduce(function(sum, part) {
				return (sum * 1000) + parseInt(part, 10);
			}, 0);
		}

		$("#b-submit").click(function() {
			var returnTo = getParam('return_to');
			var location = returnTo
				? returnTo + encodeURIComponent(JSON.stringify(saveOptions()))
				: "pebblejs://close#" + encodeURIComponent(JSON.stringify(saveOptions()));
			document.location = location;
		});

		$('[href="pebblejs://close"]').click(function(event) {
			var returnTo = getParam('return_to');
			if (!returnTo) {
				return;
			}

			event.preventDefault();
			document.location = returnTo;
		});

		$('[name="preset"]').change(function() {
			var preset = presets[this.value];
			if (!preset) {
				return;
			}

			$('[name="font"]').filter(function(i, btn) {
				return btn.value === preset.font;
			}).prop('checked', true);
			$('[name="foreground_colour"]').val(preset.foreground_colour);
			$('[name="background_colour"]').val(preset.background_colour);
		});

		var version = getParam('v');
		if (!version || (parseVersion(version) < parseVersion(LATEST))) {
			$('#update-available').removeClass('hidden');
		}
		else {
			$('#up-to-date').removeClass('hidden');
		}

		applyOptions();
   </script>

</body>
</html>
